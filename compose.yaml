name: gestion-neutral
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bar
      POSTGRES_DB: bar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run setup}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bar -d bar']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bar:${POSTGRES_PASSWORD}@db:5432/bar
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3182:3182'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3182/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
